# Book settings
title: "AcATaMa - Accuracy Assessment of Thematic Maps"
author: SMByC, IDEAM Colombia
copyright: "2026"
logo: img/acatama.svg

# Enable MyST extensions
parse:
  myst_enable_extensions:
    - deflist
    - html_image
    # math support (rendered by the MathJax bundled with Jupyter Book / sphinx-book-theme)
    - dollarmath   # $...$ inline and $$...$$ display math
    - amsmath      # AMS environments (align, gather, ...)

# Force re-execution of notebooks on each build.
execute:
  execute_notebooks: off

# Information about where the book exists on the web.
repository:
  url: https://github.com/SMByC/AcATaMa
  path_to_book: docs
  branch: main

html:
  favicon: img/acatama.svg

# Bibliography configuration
bibtex_bibfiles:
  - bibliography.bib

# Sphinx configuration
sphinx:
  extra_extensions:
  - "sphinx.ext.napoleon"
  - "sphinx.ext.viewcode"
  - "sphinxcontrib.bibtex"
  recursive_update: true
  config:
    # generate heading anchors down to h4 so intra- and cross-page links like
    # `[...](equations.md#post-stratified-estimation)` and
    # `[...](#confidence-level-for-random-offset)` resolve
    myst_heading_anchors: 4
    bibtex_default_style: plain
    bibtex_reference_style: author_year
    html_theme_options:
      repository_url: https://github.com/SMByC/AcATaMa
      repository_branch: main
      path_to_docs: docs
      # secondary_sidebar_items: []  # disable page-toc in sidebar
      # buttons
      use_edit_page_button: true
      use_repository_button: true
      use_download_button: false
      use_fullscreen_button: false
